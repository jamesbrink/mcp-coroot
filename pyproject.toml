[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-coroot"
version = "1.0.0"
description = "MCP server for the Coroot observability platform"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [
    {name = "James Brink", email = "james@jamesbrink.net"},
]
maintainers = [
    {name = "James Brink", email = "james@jamesbrink.net"},
]
keywords = ["mcp", "coroot", "monitoring", "observability", "apm", "tracing", "metrics", "logs", "alerts"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = [
    "mcp>=2.1,<3",
    "httpx2>=2.5",
    "pydantic>=2.12",
]

[project.urls]
Homepage = "https://github.com/jamesbrink/mcp-coroot"
Repository = "https://github.com/jamesbrink/mcp-coroot"
Issues = "https://github.com/jamesbrink/mcp-coroot/issues"
Documentation = "https://github.com/jamesbrink/mcp-coroot#readme"
Changelog = "https://github.com/jamesbrink/mcp-coroot/blob/main/CHANGELOG.md"

[project.scripts]
mcp-coroot = "mcp_coroot.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.17.0",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.4",
    "twine>=6.0.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_coroot"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = ["RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "RUF001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
no_implicit_reexport = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "--cov=src/mcp_coroot --cov-report=term-missing"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
source = ["src/mcp_coroot"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
